<!doctype html>
<html lang="en" data-lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hop · Page not found</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
(function () {
  var root = document.documentElement;
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var lang = load("hop.lang");
  if (lang !== "zh" && lang !== "en") lang = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  var theme = load("hop.theme");
  var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.lang = lang;
  root.dataset.scheme = dark ? "dark" : "light";
  root.lang = lang === "zh" ? "zh-CN" : "en";
})();
</script>
<style>
@font-face { font-family: "Geist"; src: url(/Hop/assets/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg: #fbfbfa; --ink: #1c1c1e; --muted: #6b6b70; --accent: #2468e8; color-scheme: light; }
:root[data-scheme="dark"] { --bg: #181818; --ink: #f1f1f3; --muted: #9b9ba3; --accent: #6aa0ff; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
  font: 16px/1.6 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
html[data-lang="zh"] [data-l="en"], html[data-lang="en"] [data-l="zh"] { display: none !important; }
main { max-width: 480px; text-align: center; }
img { width: 64px; height: 64px; }
h1 { margin: 24px 0 8px; font-size: 36px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
p { margin: 0 0 24px; color: var(--muted); text-wrap: pretty; }
a { display: inline-block; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600; text-decoration: none; transition: opacity .3s cubic-bezier(0.22, 1, 0.36, 1); }
a:hover { opacity: .85; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/Hop/icon.png" alt="Hop" width="64" height="64">
  <h1><span data-l="zh">找不到这个页面。</span><span data-l="en">This page doesn't exist.</span></h1>
  <p><span data-l="zh">链接可能已经改了,或者地址输错了。</span><span data-l="en">The link may have changed, or the address has a typo.</span></p>
  <a href="/Hop/"><span data-l="zh">回到 Hop 首页</span><span data-l="en">Back to Hop</span></a>
</main>
</body>
</html>
